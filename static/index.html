<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 知识库问答</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h9l4 4v14H6z" />
            <path d="M15 3v4h4" />
            <path d="M9 12h6M9 16h4" />
          </svg>
        </div>
        <div>
          <h1>知识库问答</h1>
          <p>RAG · DeepSeek · BGE</p>
        </div>
      </div>

      <section class="panel">
        <h2 class="panel-title">上传文档</h2>
        <label class="dropzone" id="dropzone" for="file-input">
          <input id="file-input" type="file" multiple
                 accept=".txt,.md,.markdown,.pdf,.docx" hidden />
          <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4" />
            <path d="m7 9 5-5 5 5" />
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
          <span class="dz-title">点击或拖拽文件到此处</span>
          <span class="dz-hint">支持 txt / md / pdf / docx</span>
        </label>
        <div class="upload-status" id="upload-status" hidden></div>
      </section>

      <section class="panel docs-panel">
        <div class="panel-head">
          <h2 class="panel-title">知识库文档</h2>
          <span class="badge" id="doc-count">0</span>
        </div>
        <ul class="doc-list" id="doc-list"></ul>
        <div class="empty" id="doc-empty">暂无文档，先上传一份资料</div>
      </section>

      <div class="sidebar-footer">
        <div class="model-line" id="model-line">正在读取服务状态…</div>
        <div class="status" id="status-pill"><i></i><span>检测中</span></div>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div>
          <h2>知识库对话</h2>
          <p>答案只依据已入库文档生成，并附引用来源</p>
        </div>
        <button class="ghost-btn" id="clear-chat" type="button">清空对话</button>
      </header>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.9 8.9 0 0 1-3.9-.9L3 20l1-5.2a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 11.5 3 8.4 8.4 0 0 1 21 11.5z" />
              <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" />
            </svg>
          </div>
          <h3>开始向你的知识库提问</h3>
          <p>上传产品手册、制度文档或论文后，提问即可得到带引用的回答。</p>
          <div class="suggestions">
            <button type="button" data-question="这份资料的主要内容是什么？">这份资料讲了什么？</button>
            <button type="button" data-question="请总结文档中的关键结论。">总结关键结论</button>
            <button type="button" data-question="文档中提到了哪些注意事项？">有哪些注意事项？</button>
          </div>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="question" rows="1" maxlength="2000"
                  placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea>
        <button class="send-btn" id="send-btn" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4z" />
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
